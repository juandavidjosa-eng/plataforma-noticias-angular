<div class="my-5">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <h2 class="mb-4" style="font-family: serif;">Contacto</h2>
      <p class="text-muted mb-4">Para sugerencias, consultas sobre suscripciones o comunicados de prensa, por favor utilice el formulario a continuación.</p>

      <form>
        <div class="mb-3">
          <label for="nombre" class="form-label fw-bold">Nombre completo <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="nombre" placeholder="Escriba su nombre y apellidos">
        </div>
        <div class="mb-3">
          <label for="correo" class="form-label fw-bold">Correo electrónico <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.es">
        </div>
        <div class="mb-4">
          <label for="mensaje" class="form-label fw-bold">Mensaje <span class="text-danger">*</span></label>
          <textarea class="form-control" id="mensaje" rows="5" placeholder="Escriba aquí los detalles de su mensaje..."></textarea>
        </div>
        <button type="button" class="btn btn-danger px-4 py-2 fw-bold">Enviar mensaje</button>
        <p class="text-muted small mt-3">* Campos obligatorios</p>
      </form>
    </div>
  </div>
</div>
