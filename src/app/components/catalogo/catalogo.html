<div class="my-5">
  <h2 class="mb-3 fw-bold" style="font-family: serif;">Catálogo de Noticias</h2>
  <p class="text-muted mb-5">Explora la totalidad de nuestra cobertura nacional e internacional. Periodismo crítico e independiente.</p>

  <div class="row g-4">
    @for (noticia of noticias; track noticia.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm border-0">
          <img [src]="noticia.imagen" class="card-img-top" [alt]="noticia.titulo" style="height: 200px; object-fit: cover;">
          <div class="card-body">
            <span class="text-danger fw-bold" style="font-size: 0.8rem;">{{ noticia.categoria }}</span>
            <h5 class="card-title mt-2 fw-bold" style="font-family: serif;">{{ noticia.titulo }}</h5>
            <p class="card-text text-muted small">{{ noticia.descripcion_corta }}</p>
          </div>
          <div class="card-footer bg-white border-0 d-flex justify-content-between align-items-center pb-3">
            <a [routerLink]="['/detalle', noticia.id]" class="btn btn-outline-dark btn-sm">Ver más</a>
            <button
              type="button"
              class="btn btn-sm"
              [class.btn-danger]="esFavorita(noticia.id)"
              [class.btn-outline-danger]="!esFavorita(noticia.id)"
              (click)="toggleFavorito(noticia)"
            >
              {{ esFavorita(noticia.id) ? 'Guardada' : 'Guardar' }}
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
